name: dyld cache image table

# Upload the shared cache header file so the image table can be parsed locally.
#
# The main cache file is only 491 KB: it holds the header, the image table (3354 entries) and the path
# strings, with the bulk in 52 subcaches.  Uploading it once ends the round trips through the runner.
#
# Tools that do not work on this cache, recorded so they are not retried: atos ("cannot load symbols for
# the file ... for architecture arm64"), nm ("not recognized as a valid object file"), dyld_info
# ("non-mach-o in fat file"), and the classic header offsets, which give imagesCount 0 because this
# cache keeps the image table fields at 0x1C0/0x1C4 instead of 0x18/0x1C.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IPSW_URL: https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw
  SYSTEMOS_MEMBER: 044-76034-038.dmg
  SYSTEMOS_SHA256: b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Fetch the 21H461 restore image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipsw"
          curl -fSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/ipsw/restore.ipsw" "$IPSW_URL"

      - name: Extract the SystemOS member
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          ipsw = Path(os.environ['RUNNER_TEMP']) / 'ipsw/restore.ipsw'
          out = Path(os.environ['RUNNER_TEMP']) / 'os'
          out.mkdir(parents=True, exist_ok=True)
          member = os.environ['SYSTEMOS_MEMBER']
          with zipfile.ZipFile(ipsw) as archive, archive.open(member) as source:
              digest = hashlib.sha256()
              with (out / member).open('wb') as target:
                  while chunk := source.read(8 * 1024 * 1024):
                      target.write(chunk)
                      digest.update(chunk)
          got, want = digest.hexdigest(), os.environ['SYSTEMOS_SHA256']
          print(f'{member} sha256 {got}')
          if got != want:
              raise SystemExit(f'{member} hashes to {got}, expected {want}')
          PY
          rm -f "$RUNNER_TEMP/ipsw/restore.ipsw"

      - name: Mount and copy the cache header file
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/systemos" "$RUNNER_TEMP/out"
          hdiutil attach -readonly -nobrowse -owners off \
            -mountpoint "$RUNNER_TEMP/systemos" "$RUNNER_TEMP/os/$SYSTEMOS_MEMBER"
          CACHE_DIR="$RUNNER_TEMP/systemos/System/Library/Caches/com.apple.dyld"
          cp "$CACHE_DIR/dyld_shared_cache_arm64" "$RUNNER_TEMP/out/"
          ls -l "$RUNNER_TEMP/out"
          sha256sum "$RUNNER_TEMP/out/dyld_shared_cache_arm64"

      - name: Upload the cache header file
        uses: actions/upload-artifact@v4
        with:
          name: dyld-cache-header
          path: ${{ runner.temp }}/out/dyld_shared_cache_arm64
          if-no-files-found: error
