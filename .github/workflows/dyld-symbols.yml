name: dyld symbols upload

# Upload dyld_shared_cache_arm64.symbols so the local symbol table can be read offline.
#
# The .symbols file is a binary table (its header starts with the cache magic), so grepping it as text
# finds nothing; but it is small enough to upload.  Format, from dyld's own sources:
#
#   struct dyld_cache_local_symbols_info {      // at offset 0
#       uint32_t nlistOffset, nlistCount;       // 0, 4
#       uint32_t stringsOffset, stringsSize;    // 8, 12
#       uint32_t entriesOffset, entriesCount;   // 16, 20
#   };
#   struct dyld_cache_local_symbols_entry {     // 12 bytes each
#       uint32_t dylibOffset;                   // VM offset of the image from the cache base
#       uint32_t nlistStartIndex, nlistCount;
#   };
#
# Together with the image table in dyld_shared_cache_arm64 (3354 images at 0x270), that maps an address
# to image, function and offset.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IPSW_URL: https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw
  SYSTEMOS_MEMBER: 044-76034-038.dmg
  SYSTEMOS_SHA256: b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Fetch the 21H461 restore image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipsw"
          curl -fSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/ipsw/restore.ipsw" "$IPSW_URL"

      - name: Extract the SystemOS member
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          ipsw = Path(os.environ['RUNNER_TEMP']) / 'ipsw/restore.ipsw'
          out = Path(os.environ['RUNNER_TEMP']) / 'os'
          out.mkdir(parents=True, exist_ok=True)
          member = os.environ['SYSTEMOS_MEMBER']
          with zipfile.ZipFile(ipsw) as archive, archive.open(member) as source:
              digest = hashlib.sha256()
              with (out / member).open('wb') as target:
                  while chunk := source.read(8 * 1024 * 1024):
                      target.write(chunk)
                      digest.update(chunk)
          got, want = digest.hexdigest(), os.environ['SYSTEMOS_SHA256']
          print(f'{member} sha256 {got}')
          if got != want:
              raise SystemExit(f'{member} hashes to {got}, expected {want}')
          PY
          rm -f "$RUNNER_TEMP/ipsw/restore.ipsw"

      - name: Mount and copy the symbols table
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/systemos" "$RUNNER_TEMP/out"
          hdiutil attach -readonly -nobrowse -owners off \
            -mountpoint "$RUNNER_TEMP/systemos" "$RUNNER_TEMP/os/$SYSTEMOS_MEMBER"
          CACHE_DIR="$RUNNER_TEMP/systemos/System/Library/Caches/com.apple.dyld"
          cp "$CACHE_DIR/dyld_shared_cache_arm64.symbols" "$RUNNER_TEMP/out/"
          cp "$CACHE_DIR/dyld_shared_cache_arm64" "$RUNNER_TEMP/out/"
          ls -l "$RUNNER_TEMP/out"
          echo "--- first 64 bytes of the symbols table"
          xxd -l 64 "$RUNNER_TEMP/out/dyld_shared_cache_arm64.symbols"

      - name: Split into two uploadable parts
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/out"
          # Stay under the per-artifact size that the runner uploads comfortably.
          split -b 300m -d dyld_shared_cache_arm64.symbols symbols.part.
          ls -l symbols.part.* dyld_shared_cache_arm64

      - name: Upload the symbols table
        uses: actions/upload-artifact@v4
        with:
          name: dyld-symbols-table
          path: |
            ${{ runner.temp }}/out/symbols.part.*
            ${{ runner.temp }}/out/dyld_shared_cache_arm64
          if-no-files-found: error
