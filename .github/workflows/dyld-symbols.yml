name: dyld cache header dump

# Dump the shared cache header so its layout can be read directly.
#
# Every tool tried so far rejects this cache.  atos: "cannot load symbols for the file ... for
# architecture arm64".  nm: "not recognized as a valid object file".  dyld_info: "non-mach-o in fat file"
# -- the cache is split into subcaches, and the main file is the header plus the first mappings.  Reading
# the header by hand with the classic offsets gave imagesCount 0, so this cache uses a newer layout.
# A hexdump of the first kilobyte settles it, and the image table can then be read where it really is.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IPSW_URL: https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw
  SYSTEMOS_MEMBER: 044-76034-038.dmg
  SYSTEMOS_SHA256: b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f

jobs:
  dump:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Fetch the 21H461 restore image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipsw"
          curl -fSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/ipsw/restore.ipsw" "$IPSW_URL"

      - name: Extract the SystemOS member
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          ipsw = Path(os.environ['RUNNER_TEMP']) / 'ipsw/restore.ipsw'
          out = Path(os.environ['RUNNER_TEMP']) / 'os'
          out.mkdir(parents=True, exist_ok=True)
          member = os.environ['SYSTEMOS_MEMBER']
          with zipfile.ZipFile(ipsw) as archive, archive.open(member) as source:
              digest = hashlib.sha256()
              with (out / member).open('wb') as target:
                  while chunk := source.read(8 * 1024 * 1024):
                      target.write(chunk)
                      digest.update(chunk)
          got, want = digest.hexdigest(), os.environ['SYSTEMOS_SHA256']
          print(f'{member} sha256 {got}')
          if got != want:
              raise SystemExit(f'{member} hashes to {got}, expected {want}')
          PY
          rm -f "$RUNNER_TEMP/ipsw/restore.ipsw"

      - name: Mount the SystemOS volume read-only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/systemos"
          hdiutil attach -readonly -nobrowse -owners off \
            -mountpoint "$RUNNER_TEMP/systemos" "$RUNNER_TEMP/os/$SYSTEMOS_MEMBER"

      - name: Dump the cache header
        run: |
          set -euo pipefail
          CACHE_DIR="$RUNNER_TEMP/systemos/System/Library/Caches/com.apple.dyld"
          CACHE="$CACHE_DIR/dyld_shared_cache_arm64"
          mkdir -p "$RUNNER_TEMP/out"
          {
            echo "=== cache directory"
            ls -l "$CACHE_DIR"
            echo
            echo "=== first 0x400 bytes of the main cache"
            xxd -l 0x400 "$CACHE"
            echo
            echo "=== nonzero 4- and 8-byte fields in the first 0x100 bytes"
            python3 - "$CACHE" <<'PY'
          import struct, sys
          with open(sys.argv[1], 'rb') as fh:
              head = fh.read(0x100)
          print('magic:', head[:16])
          for off in range(0x10, 0x100, 4):
              (v,) = struct.unpack_from('<I', head, off)
              if v:
                  print('  %#04x  u32 %#x (%d)' % (off, v, v))
          for off in range(0x10, 0x100, 8):
              (v,) = struct.unpack_from('<Q', head, off)
              if v:
                  print('  %#04x  u64 %#x (%d)' % (off, v, v))
          PY
          } 2>&1 | tee "$RUNNER_TEMP/out/header.txt"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dyld-header
          path: ${{ runner.temp }}/out/header.txt
          if-no-files-found: warn
