name: dyld cache symbols

# Name the image behind userland addresses in the target's dyld shared cache.
#
# The cache lives inside the sealed SystemCryptex volume, and no Linux APFS reader walks a sealed
# volume's directory tree, so a macOS runner mounts it with hdiutil.
#
# Three approaches have been tried and two of them do not work, which is why this one reads the header
# directly:
#   * atos refuses these caches: "cannot load symbols for the file ... for architecture arm64".
#   * nm does not recognise the cache as an object file.
#   * dyld_shared_cache_arm64.symbols is a binary table, so grepping it as text finds nothing.
# scripts/cache-images.py reads dyld_cache_header's image table (addresses plus path strings) and names
# the image containing each address, with the offset inside it.

on:
  workflow_dispatch:
    inputs:
      addresses:
        description: Space-separated user addresses to resolve
        required: true
        default: "0x1c39224f8 0x1a140b2ec 0x100c58b0c 0x1011a0b0c"

permissions:
  contents: read

env:
  IPSW_URL: https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw
  SYSTEMOS_MEMBER: 044-76034-038.dmg
  SYSTEMOS_SHA256: b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f
  ADDRESSES: ${{ inputs.addresses }}

jobs:
  images:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Check out this device repository
        uses: actions/checkout@v4
        with:
          path: device
          persist-credentials: false

      - name: Fetch the 21H461 restore image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipsw"
          curl -fSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/ipsw/restore.ipsw" "$IPSW_URL"
          ls -lh "$RUNNER_TEMP/ipsw/restore.ipsw"

      - name: Extract and verify the SystemOS member
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          ipsw = Path(os.environ['RUNNER_TEMP']) / 'ipsw/restore.ipsw'
          out = Path(os.environ['RUNNER_TEMP']) / 'os'
          out.mkdir(parents=True, exist_ok=True)
          member = os.environ['SYSTEMOS_MEMBER']
          with zipfile.ZipFile(ipsw) as archive, archive.open(member) as source:
              digest = hashlib.sha256()
              with (out / member).open('wb') as target:
                  while chunk := source.read(8 * 1024 * 1024):
                      target.write(chunk)
                      digest.update(chunk)
          got, want = digest.hexdigest(), os.environ['SYSTEMOS_SHA256']
          print(f'{member} sha256 {got}')
          if got != want:
              raise SystemExit(f'{member} hashes to {got}, expected {want}')
          PY
          rm -f "$RUNNER_TEMP/ipsw/restore.ipsw"

      - name: Mount the SystemOS volume read-only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/systemos"
          hdiutil attach -readonly -nobrowse -owners off \
            -mountpoint "$RUNNER_TEMP/systemos" "$RUNNER_TEMP/os/$SYSTEMOS_MEMBER"
          ls -l "$RUNNER_TEMP/systemos/System/Library/Caches/com.apple.dyld" | tail -6

      - name: Name the images
        run: |
          set -euo pipefail
          CACHE_DIR="$RUNNER_TEMP/systemos/System/Library/Caches/com.apple.dyld"
          CACHE="$CACHE_DIR/dyld_shared_cache_arm64"
          mkdir -p "$RUNNER_TEMP/out"
          {
            echo "=== cache-images.py (header image table)"
            python3 device/scripts/cache-images.py "$CACHE" $ADDRESSES || true
            echo
            echo "=== dyld_info presence"
            command -v dyld_info || echo "  dyld_info not on PATH"
            echo
            echo "=== dyld_info -segments -> image per address"
            xcrun dyld_info -segments "$CACHE" > "$RUNNER_TEMP/segs.txt" 2>"$RUNNER_TEMP/out/segs.err" || true
            echo "segments lines: $(wc -l < "$RUNNER_TEMP/segs.txt")"
            head -3 "$RUNNER_TEMP/out/segs.err" || true
            python3 device/scripts/image-from-segments.py "$RUNNER_TEMP/segs.txt" $ADDRESSES || true
          } 2>&1 | tee "$RUNNER_TEMP/out/images.txt"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dyld-images
          path: ${{ runner.temp }}/out/images.txt
          if-no-files-found: warn
