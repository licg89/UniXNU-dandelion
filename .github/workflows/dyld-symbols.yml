name: userspace binaries

# Copy the binaries that trap, so their own __TEXT can be disassembled locally.
#
# watchdogd traps at 0x1005f8b0c and 0x100eefb0c, which is outside the shared cache: those are its own
# code.  SpringBoard and liveactivitiesd trap inside the cache, where the per-process slide makes the
# image ambiguous, so their own binaries settle what the cache cannot.
#
# The sealed SystemCryptex volume cannot be read on Linux, but a macOS runner mounts it with hdiutil.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IPSW_URL: https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw
  SYSTEMOS_MEMBER: 044-76034-038.dmg
  SYSTEMOS_SHA256: b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f

jobs:
  copy:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Fetch the 21H461 restore image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipsw"
          curl -fSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/ipsw/restore.ipsw" "$IPSW_URL"

      - name: Extract the SystemOS member
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          ipsw = Path(os.environ['RUNNER_TEMP']) / 'ipsw/restore.ipsw'
          out = Path(os.environ['RUNNER_TEMP']) / 'os'
          out.mkdir(parents=True, exist_ok=True)
          member = os.environ['SYSTEMOS_MEMBER']
          with zipfile.ZipFile(ipsw) as archive, archive.open(member) as source:
              digest = hashlib.sha256()
              with (out / member).open('wb') as target:
                  while chunk := source.read(8 * 1024 * 1024):
                      target.write(chunk)
                      digest.update(chunk)
          got, want = digest.hexdigest(), os.environ['SYSTEMOS_SHA256']
          print(f'{member} sha256 {got}')
          if got != want:
              raise SystemExit(f'{member} hashes to {got}, expected {want}')
          PY
          rm -f "$RUNNER_TEMP/ipsw/restore.ipsw"

      - name: Mount and copy the trapping binaries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/systemos" "$RUNNER_TEMP/out"
          hdiutil attach -readonly -nobrowse -owners off \
            -mountpoint "$RUNNER_TEMP/systemos" "$RUNNER_TEMP/os/$SYSTEMOS_MEMBER"
          ROOT="$RUNNER_TEMP/systemos"
          set +e
          for path in \
            System/Library/CoreServices/SpringBoard.app/SpringBoard \
            usr/libexec/watchdogd \
            usr/libexec/liveactivitiesd \
            System/Library/CoreServices/backboardd \
            usr/libexec/backboardd
          do
            if [ -f "$ROOT/$path" ]; then
              cp "$ROOT/$path" "$RUNNER_TEMP/out/$(basename "$path")"
              echo "copied $path"
            else
              echo "missing $path"
            fi
          done
          set -e
          echo "--- also list the likely directories"
          ls "$ROOT/System/Library/CoreServices" 2>/dev/null | head -10 || true
          ls "$ROOT/usr/libexec" 2>/dev/null | grep -iE 'watchdog|activity|backboard' | head -10 || true
          ls -l "$RUNNER_TEMP/out"

      - name: Upload the binaries
        uses: actions/upload-artifact@v4
        with:
          name: userspace-binaries
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
