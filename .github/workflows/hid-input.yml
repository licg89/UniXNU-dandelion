name: HID input

# Build ShengHidInput on a macOS runner and publish the archive for local linking.
#
# Why this job exists: the official builder (UniXNU scripts/build-sheng-hid-input.py) compiles
# NativeHidInput.cpp against the iPhoneOS SDK with xcrun and post-processes with brew llvm, so it needs
# macOS, and it binds against the real IOHIDFamily ABI read from a prelinked kernel candidate.
#
# Two things travel through the abi-dandelion release: the kernel candidate (kernel.macho and
# kernel.json from the dandelion prelink) and xnu-compile-tree.tar.gz, which holds only the headers and
# recipes the kernel compile needs (19 MB: 6158 headers, the .cpo.json recipes, meta_features.h and the
# Kernel.framework PrivateHeaders).  IOHIDFamily headers are not in that tree; they come from the macOS
# iPhoneOS SDK on the runner, which is why this cannot be done on the Linux host.
#
# The recipe records absolute include paths from the machine that built the kernel, so this job rewrites
# them to the runner checkout and appends the two flags the dandelion build needs: the source-interface
# switch (the repository no longer carries OriginalHidDeviceABI.h) and the SDK sysroot.

on:
  workflow_dispatch:
    inputs:
      unixnu_ref:
        description: UniXNU ref that provides scripts/build-sheng-hid-input.py
        required: true
        default: main
      hid_revision:
        description: ShengHidInput revision (catalog pins 71a40e76daeae1bb4127546f96ffa7339c7a06ff)
        required: true
        default: 71a40e76daeae1bb4127546f96ffa7339c7a06ff

permissions:
  contents: read

env:
  UNIXNU_REPO: https://github.com/UniXNU/UniXNU.git
  HID_REPO: https://github.com/UniXNU/ShengHidInput.git
  CANDIDATE_TAG: abi-dandelion
  # Prefix the kernel build wrote into its compile recipes.
  RECIPE_PREFIX: /root/work/UniXNU/out/dandelion/ipados-17.7.11-21H461/dandelion/tree

jobs:
  hid:
    runs-on: macos-26
    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4

      - name: Check out UniXNU for the official builder
        run: |
          # kits/XnuPrelink is a submodule and native_prelink lives there, so recurse.
          git clone --branch "${{ inputs.unixnu_ref }}" --recurse-submodules --shallow-submodules \
            "$UNIXNU_REPO" ~/unixnu
          test -f ~/unixnu/scripts/build-sheng-hid-input.py
          test -f ~/unixnu/kits/XnuPrelink/native_prelink.py

      - name: Fetch the release assets
        run: |
          mkdir -p ~/assets
          gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'kernel.macho' --pattern 'kernel.json' \
            --pattern 'xnu-compile-tree.tar.gz' --dir ~/assets
          ls -l ~/assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Place the kernel candidate where the builder expects it
        run: |
          # The builder falls back to this glob, so the name must match it.
          mkdir -p ~/unixnu/build/xnu-prelink
          cp ~/assets/kernel.macho \
            ~/unixnu/build/xnu-prelink/native-owner-ufs-cpu-desktop-dandelion-candidate.macho
          cp ~/assets/kernel.json \
            ~/unixnu/build/xnu-prelink/native-owner-ufs-cpu-desktop-dandelion-candidate.json

      - name: Unpack the kernel compile tree
        run: |
          tar xzf ~/assets/xnu-compile-tree.tar.gz -C ~/unixnu
          test -f ~/unixnu/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/iokit/DEVELOPMENT/IOPlatformExpert.cpo.json
          test -d ~/unixnu/.cache/fakeroot

      - name: Rewrite the recipe for this runner
        run: |
          cd ~/unixnu
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "sdk: $SDK"
          python3 - "$SDK" "$RECIPE_PREFIX" <<'PY'
          import json, pathlib, sys
          sdk, prefix = sys.argv[1], sys.argv[2]
          home = pathlib.Path.home() / 'unixnu'
          recipe = home / 'build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/iokit/DEVELOPMENT/IOPlatformExpert.cpo.json'
          record = json.loads(recipe.read_text().strip().rstrip(','))
          args = [a.replace(prefix, str(home)) for a in record['arguments']]
          # The recipe names the Linux toolchain that built the kernel; this runner has Xcode instead.
          # The target triple, -fapple-kext and the include paths are unchanged, so the same source
          # compiles to the same kernel ABI.
          if args and args[0].startswith('/opt/unixnu-linux'):
              print('compiler:', args[0], '-> xcrun clang')
              args[0] = 'xcrun'
              args.insert(1, 'clang')
          extra = [
              # The repository no longer ships OriginalHidDeviceABI.h, so use the source interface.
              '-DNATIVE_HID_SOURCE_API=1',
              # IOHIDFamily headers live in the iPhoneOS SDK, not in the kernel tree.
              '-isysroot', sdk,
              '-I', sdk + '/usr/include',
              '-iframework', sdk + '/System/Library/Frameworks',
          ]
          for flag in extra:
              if flag not in args:
                  args.append(flag)
          record['arguments'] = args
          record['file'] = str(home / '.cache/xnu-work/iokit/Kernel/IOPlatformExpert.cpp')
          # build-arm-driver.py runs the compile with cwd=record['directory'], so it has to be a
          # directory this runner actually has.
          record['directory'] = str(home / 'build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/iokit/DEVELOPMENT')
          recipe.write_text(json.dumps(record) + '\n')
          print('recipe rewritten: %d arguments, prefix replaced with %s' % (len(args), home))
          print('directory:', record['directory'])
          PY

      - name: Fetch the HID component at the pinned revision
        run: |
          git clone "$HID_REPO" ~/unixnu/drivers/ShengHidInput
          cd ~/unixnu/drivers/ShengHidInput
          git checkout "${{ inputs.hid_revision }}"
          git log --oneline -1

      - name: Verify the candidate against the recorded ABI
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          home = pathlib.Path.home() / 'unixnu'
          cand = home / 'build/xnu-prelink/native-owner-ufs-cpu-desktop-dandelion-candidate.macho'
          plan = json.loads(cand.with_suffix('.json').read_text())
          snap = json.loads(pathlib.Path('${{ github.workspace }}/scripts/hid-abi-snapshot.json').read_text())
          assert hashlib.sha256(cand.read_bytes()).hexdigest() == plan['candidate_sha256'], 'candidate does not match its plan'
          hid = plan['original_executable_sha256']['com.apple.iokit.IOHIDFamily']
          assert hid == snap['hid_text_exec_sha256'], 'IOHIDFamily hash differs from the recorded snapshot'
          print('candidate matches the recorded ABI:', hid[:24])
          PY

      - name: Build ShengHidInput with the official builder
        run: |
          set -o pipefail
          cd ~/unixnu
          python3 scripts/build-sheng-hid-input.py 2>&1 | tail -60
          ls -l build/sheng-hid-input/

      - name: Publish the archive
        uses: actions/upload-artifact@v4
        with:
          name: sheng-hid-input
          path: |
            /Users/runner/unixnu/build/sheng-hid-input/libShengHidInput.a
            /Users/runner/unixnu/build/sheng-hid-input/NativeHidInput.late.o
            /Users/runner/unixnu/build/sheng-hid-input/abi-audit.json
          if-no-files-found: error
