name: HID input

# Build ShengHidInput on a macOS runner and publish the archive for local linking.
#
# Why a runner: the official builder compiles against the iPhoneOS SDK with xcrun and post-processes
# with brew llvm, and it binds against the real IOHIDFamily ABI.  The dandelion host is Linux, so this
# job does it, and two things travel through the abi-dandelion release: the kernel candidate
# (kernel.macho + kernel.json) and xnu-compile-tree.tar.gz, which holds only the headers and recipes
# the kernel compile needs (19 MB, packed from a 547 MB build tree).
#
# Why the compile is driven here rather than by build-arm-driver.py: that helper runs the recipe
# verbatim, and the dandelion recipe names the Linux clang and carries -arch alongside --target.
# Handing that argv to the macOS driver produces "cannot specify -o when generating multiple output
# files" even though it has one input and one -o.  So this job builds the command from the same
# recipe itself, normalises those driver-level options, and then lets the official script do the part
# that matters, which is binding the owned methods to the original IOHIDDevice slots.

on:
  workflow_dispatch:
    inputs:
      unixnu_ref:
        description: UniXNU ref that provides scripts/build-sheng-hid-input.py
        required: true
        default: main
      hid_revision:
        description: ShengHidInput revision (catalog pins 71a40e76daeae1bb4127546f96ffa7339c7a06ff)
        required: true
        default: 71a40e76daeae1bb4127546f96ffa7339c7a06ff

permissions:
  contents: read

env:
  UNIXNU_REPO: https://github.com/UniXNU/UniXNU.git
  HID_REPO: https://github.com/UniXNU/ShengHidInput.git
  CANDIDATE_TAG: abi-dandelion
  RECIPE_PREFIX: /root/work/UniXNU/out/dandelion/ipados-17.7.11-21H461/dandelion/tree

jobs:
  hid:
    runs-on: macos-26
    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4

      - name: Check out UniXNU for the official builder
        run: |
          git clone --branch "${{ inputs.unixnu_ref }}" --recurse-submodules --shallow-submodules \
            "$UNIXNU_REPO" ~/unixnu
          test -f ~/unixnu/scripts/build-sheng-hid-input.py
          test -f ~/unixnu/kits/XnuPrelink/native_prelink.py

      - name: Fetch the release assets
        run: |
          mkdir -p ~/assets
          gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'kernel.macho' --pattern 'kernel.json' \
            --pattern 'xnu-compile-tree.tar.gz' --pattern 'hidfamily-headers.tar.gz' --dir ~/assets
          ls -l ~/assets
          mkdir -p ~/hidheaders
          tar xzf ~/assets/hidfamily-headers.tar.gz -C ~/hidheaders
          test -f ~/hidheaders/IOKit/hid/IOHIDDevice.h
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Place the kernel candidate where the builder expects it
        run: |
          mkdir -p ~/unixnu/build/xnu-prelink
          cp ~/assets/kernel.macho \
            ~/unixnu/build/xnu-prelink/native-owner-ufs-cpu-desktop-dandelion-candidate.macho
          cp ~/assets/kernel.json \
            ~/unixnu/build/xnu-prelink/native-owner-ufs-cpu-desktop-dandelion-candidate.json

      - name: Unpack the kernel compile tree
        run: |
          tar xzf ~/assets/xnu-compile-tree.tar.gz -C ~/unixnu
          test -f ~/unixnu/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/iokit/DEVELOPMENT/IOPlatformExpert.cpo.json

      - name: Fetch the HID component at the pinned revision
        run: |
          git clone "$HID_REPO" ~/unixnu/drivers/ShengHidInput
          cd ~/unixnu/drivers/ShengHidInput
          git checkout "${{ inputs.hid_revision }}"
          git log --oneline -1

      - name: Verify the candidate against the recorded ABI
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          home = pathlib.Path.home() / 'unixnu'
          cand = home / 'build/xnu-prelink/native-owner-ufs-cpu-desktop-dandelion-candidate.macho'
          plan = json.loads(cand.with_suffix('.json').read_text())
          snap = json.loads(pathlib.Path('${{ github.workspace }}/scripts/hid-abi-snapshot.json').read_text())
          assert hashlib.sha256(cand.read_bytes()).hexdigest() == plan['candidate_sha256'], 'candidate does not match its plan'
          hid = plan['original_executable_sha256']['com.apple.iokit.IOHIDFamily']
          assert hid == snap['hid_text_exec_sha256'], 'IOHIDFamily hash differs from the recorded snapshot'
          print('candidate matches the recorded ABI:', hid[:24])
          PY

      - name: Compile the component with the kernel recipe
        run: |
          cd ~/unixnu
          python3 - "$RECIPE_PREFIX" <<'PY'
          import json, os, pathlib, subprocess, sys
          prefix = sys.argv[1]
          home = pathlib.Path.home() / 'unixnu'
          sdk = subprocess.check_output(['xcrun', '--sdk', 'iphoneos', '--show-sdk-path'], text=True).strip()
          recipe = home / 'build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/iokit/DEVELOPMENT/IOPlatformExpert.cpo.json'
          record = json.loads(recipe.read_text().strip().rstrip(','))
          args = [a.replace(prefix, str(home)) for a in record['arguments']]
          source = home / 'drivers/ShengHidInput/NativeHidInput.cpp'
          out_dir = home / 'build/sheng-hid-input'
          out_dir.mkdir(parents=True, exist_ok=True)
          destination = out_dir / 'NativeHidInput.o'

          # Rebuild the command, dropping the driver-level options that make the macOS driver build more
          # than one job: -arch and the recipe's own --target (replaced with an explicit one below).
          # The arguments already carry the rewritten prefix, so the source path to match against has to
          # be rewritten the same way.
          recipe_source = record['file'].replace(prefix, str(home))
          cmd, i = [], 0
          while i < len(args):
              a = args[i]
              if a == recipe_source:
                  cmd.append(str(source)); i += 1; continue
              if a == '-o':
                  i += 2; continue
              if a in ('-arch', '--target'):
                  i += 2; continue
              if a == '-Xclang' and i + 1 < len(args) and args[i + 1].startswith('-W'):
                  i += 2; continue
              if a.startswith('-W'):
                  i += 1; continue
              cmd.append(a); i += 1

          # The recipe's argv[0] is the Linux clang that built the kernel; this runner has Xcode.
          cmd = ['xcrun', 'clang'] + cmd[1:]
          cmd += [
              '--target=arm64-apple-ios17.0',
              # The kernel tree already provides the IOKit headers, and adding the SDK include directory
              # as well makes its MacTypes.h collide with the kernel's own types.  The SDK stays only as
              # a sysroot, and lowered priority for anything the packed headers do not name.
              '-isysroot', sdk,
              '-idirafter', sdk + '/usr/include',
              # IOHIDFamily-2031.120.4 headers come from Apple's open-source distribution, packed in the
              # release, because the runner SDK does not ship these kernel-private headers.
              '-I', str(pathlib.Path.home() / 'hidheaders'),
              '-I', str(home / '.cache/xnu-work/osfmk'),
              '-I', str(home / 'build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/iokit/DEVELOPMENT'),
              '-DNATIVE_HID_SOURCE_API=1',
              # The recipe's own -c stays in place and the source is substituted at its original
              # position above, so only the output has to be appended; adding -c source here as well
              # gave clang two inputs and it refuses to write one output for them.
              '-o', str(destination),
              '-Wno-everything',
          ]
          print('argument count:', len(cmd))
          print('compiler:', ' '.join(cmd[:2]))
          (out_dir / 'compile-command.json').write_text(json.dumps(cmd, indent=2) + '\n')
          result = subprocess.run(cmd, capture_output=True, text=True,
                                  cwd=str(home / 'build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/iokit/DEVELOPMENT'))
          (out_dir / 'compile.log').write_text((result.stdout or '') + (result.stderr or ''))
          if result.returncode:
              print((result.stdout or '') + (result.stderr or ''))
              raise SystemExit('compile failed rc=%d' % result.returncode)
          print('compiled:', destination, destination.stat().st_size, 'bytes')
          PY

      - name: Bind with the official builder
        run: |
          set -o pipefail
          cd ~/unixnu
          # The official script's first act is the compile this job already did; replace that one call
          # so the rest of it (the ABI binding it is there for) runs unchanged.
          sed "s|print(run(\['python3',ROOT/'scripts/build-arm-driver.py','NativeHidInput'\],text=True),end='')|print('using the object already compiled')|" \
            scripts/build-sheng-hid-input.py > scripts/build-sheng-hid-input-runner.py
          grep -n 'using the object already compiled' scripts/build-sheng-hid-input-runner.py
          python3 scripts/build-sheng-hid-input-runner.py 2>&1 | tail -30
          ls -l build/sheng-hid-input/

      - name: Publish the archive
        uses: actions/upload-artifact@v4
        with:
          name: sheng-hid-input
          path: |
            /Users/runner/unixnu/build/sheng-hid-input/libShengHidInput.a
            /Users/runner/unixnu/build/sheng-hid-input/NativeHidInput.late.o
            /Users/runner/unixnu/build/sheng-hid-input/NativeHidInput.o
            /Users/runner/unixnu/build/sheng-hid-input/abi-audit.json
            /Users/runner/unixnu/build/sheng-hid-input/compile.log
          if-no-files-found: warn
