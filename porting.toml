[[area]]
id = "memory"
status = "verified"
components = []
paths = ["dts/**", "package/*Smmu*", "package/*Memory*", "scripts/*smmu*", "scripts/*memory*"]
inputs = ["Identify the memory and dma hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for memory and dma."]
procedure = ["Follow the memory and dma stage in the porting guide and record the actual commands."]
findings = [
  "Measured on the phone: DRAM runs to 4 GiB; the firmware memory map stopped at ATF Ramdump (0xC0000000), so everything above 3 GiB was UNMAPPED and DarwinBoot could never find a contiguous run for a larger window.",
  "Adding DRAM High Conv (0xC0000000 + 2 GiB, CONVENTIONAL) to MemoryMapLib.c and rebuilding the FIRMWARE FROM CLEAN lifted the kernel from 47759 to 241347 free pages (764 MB -> 3.68 GB). An incremental firmware build was not enough: the memory map lives in MemoryInitPei.",
  "AllocateWindow tried exactly one candidate per free run, aligned to the kernel load offset, so the fit depended on the kernel binary size: a few hundred bytes of trace made even the 0x30000000 window fail. It now tries the aligned and the plain candidate.",
  "Consequence: the process-kill count over a boot fell from 4972 to 36 and the process peak rose from 46 to 84.",
]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["Swap still cannot be created before the Data volume has a writable /private/var (vm_swap_create_file failed EROFS)."]
next_action = ["Enable swap once the Data seed exists; then re-measure jetsam under load."]
evidence = [
  "vm_page_bootstrap: 47759 free pages (0x30000000 window, firmware without DRAM High Conv)",
  "vm_page_bootstrap: 241347 free pages, 20797 wired pages (0x40000000 window, firmware with DRAM High Conv)",
  "DARWINBOOT: window requested 40000000 default 30000000 / ARM64 va=0xFFFFFFF00427C000 pa=0xC007C000 owned=0x40000000",
  "Panel crash report: pages=0x000000000003aec5",
]

[[area]]
id = "storage"
status = "verified"
components = []
paths = ["package/NativeMsdc.cpp", "package/NativeMsdc.h", "configs/dandelion_defconfig", "board.toml"]
inputs = ["eMMC on MSDC0 0x11230000, polled PIO, 512-byte sectors. userdata=mmcblk0p41, flashinfo=mmcblk0p43. The OS and SystemOS windows live inside userdata."]
configuration = ["native-msdc-root=1, native-msdc-mode=1, native-msdc-area=20480, native-msdc-persist=1, native-msdc-clock=1, native-msdc-hsmode=1. Transfer granularity is kMaxBlocks=128 (64 KiB)."]
procedure = ["Build, flash the boot partition, boot, and read the flashinfo console block for the RD progress line and the read-timing lines."]
findings = ["The kernel mounts SystemOS and the Data seed and starts launchd from the OS volume.", "The eMMC host is linked in with -force_load in CONFIG_XNU_EXTRA_LD_ARCHIVES; before that the storage symbols were link stubs and init failed.", "A 4 GiB Data seed cannot boot on a 4 GB phone because DarwinBoot expands the packed seed to its logical size in RAM; 512 MiB is the ceiling.", "Reads run at about 250-360 us per 8-block transfer with 128-block bursts. Tuning the divider up does not help: kMaxBlocks 128 to 512 cut the read count but left the wall time at 226,823 ms, and native-msdc-clockearly cut the policy read from 228,108 ms to 4,978 ms while corrupting reads (verify got 16899be4 want 12df6896) and failing the root mount."]
completion = ["Host: register, clock, link and SMMU facts match the board inventory.", "Reads: SCSI capacity, GPT and known blocks are correct; OS/SystemOS windows stay within userdata.", "Root: the configured volume mounts and launchd starts. Persistence: writes survive reboot within the allocated Data region."]
limits = ["Reads are polled PIO, so large reads are slow and a raised clock corrupts data. DMA and a raised source clock both fail to mount the root device. The store is not used for writes yet (writes=0)."]
next_action = ["Move the read path to interrupt-driven or DMA transfers, or find a divider that stays correct under sustained load, before any speed work."]
evidence = [
  "adb shell ls -l /dev/block/by-name/ => userdata=mmcblk0p41, flashinfo=mmcblk0p43, super=mmcblk0p38",
  "D4K beat 1036: reads=4746758 writes=0 retries=2837 failures=7",
  "native-msdc-clockearly: policy read 228108ms -> 4978ms with verify mismatches; reverted",
  "kMaxBlocks 512: reads 1123 -> 284 but wall time 228108 -> 226823 ms; reverted to 128",
]
[[area]]
id = "display"
status = "verified"
components = []
paths = ["package/DandelionLegacyDisplay.cpp", "package/NativeMsdc.cpp", "board.toml", "configs/dandelion_defconfig"]
inputs = ["UEFI GOP framebuffer 720x1600 at 0x7ec50000, stride 2944, 32-bit; the vendor LK leaves the panel lit."]
configuration = ["offline-legacy-register=1, offline-legacy-gop=1, offline-legacy-unit-scale=2, offline-legacy-pm=1, offline-legacy-phase=4, offline-legacy-transfer=1, offline-legacy-validate=1, offline-legacy-cpu-present=1 allow the legacy IOMobileFramebuffer provider to publish. dandelion-panel-text=1 restores the diagnostic overlay, which is off by default."]
procedure = ["Build with scripts/package.sh and the UniXNU main-branch Data seed, flash the boot partition, boot, and read the flashinfo console block."]
findings = ["The legacy GOP provider publishes: DISP PROBE/INIT/SURF/MAP 720x1600/NUB A1 S1/P1 A1 S1/ARMIO/PM/UP, and backboardd opens it as display client 57.", "SpringBoard must not be an IOMFB client; backboardd owns the display and submits the frames.", "Once the Data seed carried the launchd disabled plist, the service graph stopped starving and the frames kept coming: DISP COPY 330, DISP RET 330, F330 over a 5.75-hour run with sb=27:2 and bb=57:2 in beat 1036.", "The iPadOS lock screen renders: date, clock, wallpaper, Press home to open, and the status bar.", "Before the seed fix the same code retired only six or seven frames and stopped on the Apple logo, because launchd stopped spawning after Too many corpses being created."]
completion = ["A known frame appears with correct geometry and colors, then userland presentation and backlight controls work."]
limits = ["IOMFB_FDR_Loader still exits 0x100. There is no backlight control and no input, so the lock screen cannot be unlocked. watchdogd still exits 33 times and liveactivitiesd 87 times per 5.75 hours; neither blocks presentation."]
next_action = ["Add a MediaTek I2C touch driver so the lock screen can be unlocked, then re-check IOMFB_FDR_Loader exit 0x100."]
evidence = [
  "adb shell wm size => 720x1600, wm density => 320",
  "dmesg: [LCM] tps65132_probe - LCM bias supply is a TPS65132 over I2C",
  "DISP RET 330/330 F330 with S57:backboardd, over D4K beat 1036",
  "DANDELION-DATA: mount=0 stage=4 dev=16777219 seed=536870912 disabled=0",
]
[[area]]
id = "input"
status = "planned"
components = []
paths = ["dts/dandelion.dts", "board.toml"]
inputs = ["The touch controller is a Novatek NT36525B (dmesg [NVT-ts] HEILITAI nt36525b) on the MediaTek I2C bus, IRQ gpio 329. The panel is 720x1600 at density 320."]
configuration = ["Nothing selected. No input component is included in board.toml."]
procedure = ["Identify the bus, IRQ and protocol of the controller, then implement the driver and the HID sink."]
findings = ["The UniXNU catalog touch stack is ShengHidInput plus ShengNovatekTouch, written for the Novatek NT36532E on a Qualcomm GENI SPI bus. This board has a different sensor (NT36525B) on a different bus (MediaTek I2C), and the catalog has no MediaTek I2C controller driver.", "nx769j records the same mismatch for a Goodix panel and deliberately selects no input component, so the catalog offer is not portable to this bus without new work.", "The yunluo record states its Novatek host models cover NT36532-family behaviour only and qualify no real firmware, bus timing, IRQ or HID consumer path.", "The official HID sink is separable in principle: ShengHidInput/NativeHidInput.cpp is a standalone IOHIDDevice subclass exporting native_hid_input_allocate, native_buttons_set_sink and native_touch_set_sink, and its report 2 carries Menu/Home on bit 0, so a synthetic Home press could unlock the lock screen with no touch controller at all.", "That path cannot be built on this Linux host: scripts/build-sheng-hid-input.py calls xcrun --sdk iphoneos and brew --prefix llvm, so it needs macOS, and it also requires build/xnu-prelink/native-owner-ufs-cpu-desktop-v9-hid-init-candidate.macho, an artifact from another device that this tree does not contain; the builder itself records runtime_qualified: false.", "No IOKit SDK headers are available offline (there is no IOHIDDevice.h in the tree) and this port declares IOKit ABI by hand, so a hand-written IOHIDDevice subclass would have to reproduce the 207-slot abstract device that the official builder verifies slot by slot against the original kernelcache. That is not a safe guess.", "Objective conclusion: reaching input needs either a macOS build host or a CI macOS runner for ShengHidInput, plus the MediaTek I2C and NT36525B work on top of it. Neither is reachable from this Linux-only build host."]
completion = ["Touches map to the display, simultaneous contacts keep stable IDs, release events arrive, and buttons produce expected HID reports."]
limits = ["No MediaTek I2C controller driver exists in the catalog, and ShengNovatekTouch speaks GENI SPI and NT36532. Reusing it needs a new bus driver plus protocol work for NT36525B, so this is new development rather than configuration. The HID sink itself also needs a macOS toolchain that this build host does not have."]
next_action = ["Scope a MediaTek I2C driver and an NT36525B protocol path, or find the controller that the vendor LK and Android use for this panel, before writing the HID sink."]
evidence = [
  "dmesg: [NVT-ts] nvt_driver_init: TP info: [Vendor]HELITAI [IC]nt36525b",
  "dmesg: [NVT-ts] nvt_parse_dt: novatek,irq-gpio=329",
  "dts: touch { compatible = \"mediatek,touch\"; }",
]
[[area]]
id = "gpu"
status = "planned"
components = []
paths = ["package/*Gpu*", "package/*Gmu*", "package/*Adreno*", "scripts/*adreno*", "scripts/*gpu*", "scripts/*metal*", "scripts/*turnip*", "scripts/*air*"]
inputs = ["GPU identity comes from Android getprop (Mali-G72 MP1 on MT6762G); registers, firmware, power domains, clocks and SMMU stream IDs are not collected."]
configuration = ["No GPU component is selected in board.toml and no gpu-* boot argument is passed."]
procedure = ["Follow the GPU stage in the porting guide once a backend exists; the documented reference covers Adreno 740 on SM8550 only."]
findings = [
  "The display does not need a GPU on this port: presentation goes through the GOP presenter and a CPU copy (DISP COPY 0 4608000), which is why the panel comes up with no graphics stack at all.",
  "The kernel carries IOGPU, IOAccelerator and AGXAccelerator strings from the prelinked Apple kexts, while no GPU component is selected here, so nothing publishes an accelerator to userland.",
  "A UI does not need this backend to appear: the reference project reached a working desktop before the GPU path existed, presenting through the CPU copy at a low frame rate, and it tunes userland rendering per job (FORCE_SOFTWARE_RENDERER, CI_ENABLE_METAL_GPU) rather than by adding a GPU.",
  "So the missing lock screen is a userland-state question first: the GPU is what turns a slow UI fast, not what lets it exist.",
]
completion = ["GPU submissions complete, mapping/fence handling is correct, a known image renders, and the selected Metal client presents it."]
limits = ["No GPU backend and no Metal; components.toml offers only Adreno740, so this board needs a new component or a board-side driver.", "UI results are not blocked on that: presentation stays on the CPU copy path and only frame rate suffers."]
next_action = ["Leave the GPU alone until a UI exists on the CPU path; read what SpringBoard does after it stops aborting before selecting any graphics work."]
evidence = [
  "getprop reports Mali-G72 MP1 on MT6762G",
  "components.toml offers exactly one GPU component, Adreno740 (hardware: Adreno 740, SM8550) - there is no Mali or panfrost component to select",
  "So the GPU path needs a new component or a board-side driver; it cannot be satisfied by an existing selection, and milestone 5's display/input work does not depend on it",
  "sr18 console: DISP COPY 0 4608000 completes and the panel shows the boot logo, with no IOGPU, IOAccelerator or Metal line anywhere in 23,634 lines",
  "kernel.macho strings: IOGPU 272, IOAccelerator 3, AGXAccelerator 3, IOMobileGraphicsFamily 6",
]

