status = "verified"
components = []
paths = ["package/CpuFreq*", "scripts/*armcpu*"]
inputs = ["Identify the cpu and interrupts hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for cpu and interrupts."]
procedure = ["Follow the cpu and interrupts stage in the porting guide and record the actual commands."]
findings = ["Collect the first cpu and interrupts observation, its cause when established, and the resulting implementation decision."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["Hardware inputs and implementation are pending for this example board."]
next_action = ["Inventory the required cpu and interrupts inputs before implementation."]
evidence = [
  "8x Cortex-A53 in two clusters, MT6762G/MT6765",
  "GICv3 non-secure view: GICD 0x0c000000, GICR 0x0c100000; INTID 27 (CNTV) and 30 (CNTP) both deliver",
  "ARM generic timer at 13 MHz; upstream CNTV/PPI 27 gives a correct 100 Hz tick, while the hand-written CNTP path produced a 5.8 kHz interrupt storm",
  "This port therefore takes the ArmCpu component instead of the previous attempt's hand-written GIC and timer patches",
]

[[area]]
id = "memory"
status = "verified"
components = []
paths = ["dts/**", "package/*Smmu*", "package/*Memory*", "scripts/*smmu*", "scripts/*memory*"]
inputs = ["Identify the memory and dma hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for memory and dma."]
procedure = ["Follow the memory and dma stage in the porting guide and record the actual commands."]
findings = [
  "Measured on the phone: DRAM runs to 4 GiB; the firmware memory map stopped at ATF Ramdump (0xC0000000), so everything above 3 GiB was UNMAPPED and DarwinBoot could never find a contiguous run for a larger window.",
  "Adding DRAM High Conv (0xC0000000 + 2 GiB, CONVENTIONAL) to MemoryMapLib.c and rebuilding the FIRMWARE FROM CLEAN lifted the kernel from 47759 to 241347 free pages (764 MB -> 3.68 GB). An incremental firmware build was not enough: the memory map lives in MemoryInitPei.",
  "AllocateWindow tried exactly one candidate per free run, aligned to the kernel load offset, so the fit depended on the kernel binary size: a few hundred bytes of trace made even the 0x30000000 window fail. It now tries the aligned and the plain candidate.",
  "Consequence: the process-kill count over a boot fell from 4972 to 36 and the process peak rose from 46 to 84.",
]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["Swap still cannot be created before the Data volume has a writable /private/var (vm_swap_create_file failed EROFS)."]
next_action = ["Enable swap once the Data seed exists; then re-measure jetsam under load."]
evidence = [
  "vm_page_bootstrap: 47759 free pages (0x30000000 window, firmware without DRAM High Conv)",
  "vm_page_bootstrap: 241347 free pages, 20797 wired pages (0x40000000 window, firmware with DRAM High Conv)",
  "DARWINBOOT: window requested 40000000 default 30000000 / ARM64 va=0xFFFFFFF00427C000 pa=0xC007C000 owned=0x40000000",
  "Panel crash report: pages=0x000000000003aec5",
]

[[area]]
id = "storage"
status = "verified"
components = []
paths = ["drivers/ShengUfs", "scripts/*ufs*", "scripts/*storage*", "scripts/*userdata*", "scripts/*root*"]
inputs = ["MT6762G MSDC0 at 0x11230000; userdata partition and the flashinfo log partition measured on the device GPT (see dts/dandelion.dts and HANDOFF 0.28)."]
configuration = ["NativeMsdc vendored driver, SHNGROOT manifest, two VerifiedRoot policy entries, ios GPT partition, native-msdc-root=1 / native-msdc-area=20480 / native-msdc-persist=1."]
procedure = ["unixnu build kernel / payload / bootimg; fastboot flash ios and boot; collect_nowipe.ps1 pulls the flashinfo console block."]
findings = [
  "eMMC runs in High Speed. Measured with a 4 KiB read: mode 2 div 0 (what the driver used) 27679 us, mode 1 div 0 14000 us, mode 0 div 2 599 us, mode 0 div 0 fails. CKMOD selects the division path and mode 2 is the DDR path; the card reports HS_TIMING 1 on eight bits, whose vendor line is mode 0 div 2.",
  "Root cause of every failed clock attempt: HostSession, the transaction guard every console write and transfer uses, restored MSDC_CFG wholesale on exit INCLUDING CKMOD and CKDIV. The first log line after any clock change put the old divider back, which is why single measurements were fast and the running system never was.",
  "With mode 0 div 2 held, a 64 KiB read takes 2226 us: about 29 MB/s, matching the reference MT6765 port. The 3.7 GB shared cache is minutes instead of a night.",
  "The console, the storage driver and every transfer share the card, so a clock change that disturbs the bus kills the log and the reads together; the panel renderer is the only channel that survives.",
]
completion = ["OS and SystemOS verify and publish; the real APFS root mounts; root hash authentication passes; launchd execs; diagnostics no longer panic. Persistence: not yet, the writable Data volume is the next stage."]
limits = ["DMA path is still disabled: it times out and was proven not to be the bottleneck (command overhead 0.6%)."]
next_action = ["Leave PIO at mode 0 div 2; revisit DMA only if command overhead ever matters."]
evidence = [
  "NativeMsdc: ckmode 0 div 2 read ok in 599 us / ckmode 2 div 0 read ok in 27679 us / ckmode 0 div 0 read failed",
  "NativeMsdc: read timing setblk=89 prep=14 cmd=88 drain=6762 total=6954 (289 us each) with mode 0 div 2 held",
  "Before the clock fix: read timing total=103000 us each",
  "NativeMsdc: clock mode 0 div 2 verified (High Speed)",
]

[[area]]
id = "display"
status = "verified"
components = ["GopFramebuffer", "IOMobileFramebufferLegacy"]
paths = ["package/*Display*", "package/*Framebuffer*", "package/*Backlight*", "package/AppleARMBacklight.cpp", "package/GeniI2c*", "scripts/*display*", "scripts/*gop*", "scripts/*framebuffer*"]
inputs = ["Identify the display hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for display."]
procedure = ["Follow the display stage in the porting guide and record the actual commands."]
findings = [
  "The synthetic IOMobileFramebufferLegacy reaches start() and publishes the panel; the firmware GOP framebuffer is at 0x7EC50000, stride 2944, 720x1600, 32 bpp.",
  "native_gop_text was a stub. It now renders a 6x10 font white-on-black into the GOP framebuffer, scale 2 at >=600 px wide, which made boot progress visible while the console was silent.",
  "IOMFB_FDR_Loader exits 1, so the userland display service is not up; backboardd and SpringBoard fail later in that chain.",
]
completion = ["A known frame appears with correct geometry and colors, then userland presentation and backlight controls work."]
limits = ["No userland presentation yet: IOMFB_FDR_Loader fails and SpringBoard/backboardd abort before compositing.", "No backlight or brightness control."]
next_action = ["Establish why IOMFB_FDR_Loader exits 1; that is the gate in front of backboardd."]
evidence = [
  "DANDELION-DISP UP / virtual bool IOMobileFramebufferLegacy::start(IOService *)",
  "DARWINBOOT: video base=0x7EC50000 display=1 row=2944 width=720 height=1600 depth=32",
  "IMG_5929.JPG / IMG_5932.JPG: colour bars plus RD progress and HS mode lines drawn by native_gop_text",
  "DANDELION-EXIT: pid=85 comm=IOMFB_FDR_Loader ppid=1 rv=0x100 sig=0 status=1",
]

