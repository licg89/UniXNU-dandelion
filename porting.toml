schema_version = 1

[device]
name = "dandelion"
soc = "MT6765"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Redmi 9A (dandelion), MediaTek MT6762G/MT6765. Rebuilt on UniXNU after a hand-rolled MACHINE=dandelion port: ArmCpu and ArmDTPlatform replace the hand-written GIC, timer and platform expert. Boots iPadOS 17.7.11 to the real lock screen through the legacy GOP display provider; input is not implemented yet."

