schema_version = 1

[device]
name = "dandelion"
soc = "MT6765"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Redmi 9A (dandelion), MediaTek MT6762G/MT6765. Rebuilt on UniXNU after a hand-rolled MACHINE=dandelion port: ArmCpu and ArmDTPlatform replace the hand-written GIC, timer and platform expert."

[[area]]
id = "configuration"
status = "verified"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore"]
inputs = ["Identify the configuration hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for configuration."]
procedure = ["Follow the configuration stage in the porting guide and record the actual commands."]
findings = ["Collect the first configuration observation, its cause when established, and the resulting implementation decision."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["Hardware inputs and implementation are pending for this example board."]
next_action = ["Inventory the required configuration inputs before implementation."]
evidence = [
  "scripts/package.sh --check --os ipados-17.7.11-21H461 => 'check done: 59 patches, configuration dandelion_defconfig, OS ipados-17.7.11-21H461'",
  "unixnu status => arch profiles/arch/arm64, soc out/feeds/UniXNU-mt6765-common-c057b7ad, os profiles/os/ipados-17.7.11-21H461, device UniXNU-dandelion",
  "unixnu status => component ArmCpu arm64, component ArmDTPlatform arm64, component DarwinBoot firmware, component XnuPrelink tool",
  "The framework fetched and unpacked the IPSW itself: out/ipsw/21H461/{kernelcache.decompressed,DeviceTree.j120ap.im4p,044-76040-038.dmg.trustcache,044-76034-038.dmg.trustcache}",
]

