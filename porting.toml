[[area]]
id = "packaging"
status = "verified"
components = ["DarwinBoot", "XnuPrelink"]
paths = ["scripts/package.sh", "scripts/build-data-seed.py", ".github/workflows/data-seed.yml", "board.toml", "configs/dandelion_defconfig"]
inputs = ["The boot partition is 64 MiB; the payload is 60 MiB. The firmware is Mu-Silicium on dandelionPkg with FD_BASE 0x41080000 and FD_SIZE 0x300000."]
configuration = ["partition_list/entry_kernel keep the known-good firmware FV and only replace the payload. The Data seed is built by the data-seed.yml macOS workflow on the main branch, then packed as DBRDISK1."]
procedure = ["bash scripts/package.sh --os 17 --uefi ../uefi-dandelion --data-ramdisk <seed>.dbr --kernel-arg panic_on_crash_disabled=1, then splice the payload into boot-sr26-emmc-linked.img and flash."]
findings = ["Splicing the payload into the known-good firmware keeps boot working; the firmware region is byte-identical after the splice.", "The repository default branch is main, so workflow_dispatch and pushes must target main; two CI seed runs produced old output because the work was pushed to master.", "A locally built mkapfs seed contains directories only, so its launchd disabled plist is absent and the service graph starves; the CI macOS seed from the OS private/var tree is the correct input."]
completion = ["Kernel and prelink succeed, payload contains all declared inputs, and the boot image matches the bootloader format and size limit."]
limits = ["seed-data-skip-setup.py needs macOS hdiutil, so the local Linux build cannot run the main-branch skip-setup tool; the seed is produced by CI instead."]
next_action = ["Keep the seed UUID in dandelion_defconfig in step with the seed the workflow emits; record the UUID in the build log."]
evidence = [
  "boot-sr43-mainseed.img and boot-sr44-clean.img: firmware unchanged, payload replaced",
  "Data seed UUID 47000E8A-66EF-4308-AEAD-1130B31752AB, 512 MiB, 39 files, 7 seed files",
  "CI run 44150566205 on main produced the seed used by sr43 and sr44",
]
