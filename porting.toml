]

[[area]]
id = "storage"
status = "in_progress"
components = []
paths = ["drivers/ShengUfs", "scripts/*ufs*", "scripts/*storage*", "scripts/*userdata*", "scripts/*root*"]
inputs = ["MT6762G MSDC0 at 0x11230000; userdata partition and the flashinfo log partition measured on the device GPT (see dts/dandelion.dts and HANDOFF 0.28)."]
configuration = ["NativeMsdc vendored driver, SHNGROOT manifest, two VerifiedRoot policy entries, ios GPT partition, native-msdc-root=1 / native-msdc-area=20480 / native-msdc-persist=1."]
procedure = ["unixnu build kernel / payload / bootimg; fastboot flash ios and boot; collect_nowipe.ps1 pulls the flashinfo console block."]
findings = [
  "eMMC bring-up, EXT_CSD, GPT and the signed-policy read all work (73 MB at about 320 KB/s).",
  "The trust cache bundle was rejected by the firmware as Compromised Data until the third module's uuid was corrected from 19 to 16+4+count bytes; scripts/verify_trustcache.py now validates the layout before flashing.",
  "The kernel console writes through the eMMC; its window was moved to the start of flashinfo and grown to 28672 sectors so the whole boot fits.",
  "namei(/usr/lib/dyld) returned errno 60 (ETIMEDOUT) because hostReadPio waited for a consumed XferDone interrupt even after all bytes were drained; accepting a drained FIFO and idle controller, with a 10 s deadline, let launchd exec pass.",
]
completion = ["OS and SystemOS verify and publish; the real APFS root mounts; root hash authentication passes; launchd execs; diagnostics no longer panic. Persistence: not yet, the writable Data volume is the next stage."]
limits = ["Failed to open swap file 30 (EROFS): there is no writable /private/var yet.", "The Data seed needs macOS hdiutil/diskutil; the GitHub Actions run was blocked by account billing, and a Linux UDIF/APFS path is being investigated.", "The console still stops writing once the storage driver runs, so the panic screen and firmware log are the reliable channels."]
next_action = ["Build the writable Data seed, set OWNER_DATA_MOUNT / NATIVE_RAM_BLOCK / OWNER_DATA_VOLUME_UUID, add packed_data_ramdisk, rebuild and verify the swap error disappears."]
evidence = [
  "attempting to load 3 external trust cache modules / loaded 0,1,2 / completed loading",
  "OS verified / SystemOS verified / published SystemOS / SystemOS volume ready / published OS",
  "BSD root: disk3s1 / mount-complete volume DawnUpdate21H461.J120J121J207J208OS / Root Volume, root hash authentication is required",
  "load_init_program: attempting to load /sbin/launchd / DANDELION-EXEC: clearing policy answer 0 (pid 1)",
  "D4K namei: path=/usr/lib/dyld raw_errno=60 @mach_loader.c:3794 (before the read fix); no longer present after it",
  "Failed to open swap file 30 / vm_swap_create_file failed @ 267 secs (EROFS, current wall)",
]

