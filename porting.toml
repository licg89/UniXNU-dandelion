next_action = ["Inventory the required firmware and boot inputs before implementation."]
evidence = [
  "uefi-dandelion carries Mu-Silicium's MT6765Pkg plus the dandelion board package (47 files) taken from the previous attempt, which boots this device: PayloadBootDxe publishes the device tree through gFdtTableGuid and writes the kernel log into the flashinfo partition",
  "Boot image layout measured on the shipped artifact: kernel slot is gzip(SILICIUM_UEFI.fd) at 2097152 bytes decompressed, ramdisk slot is the stock Android ramdisk, the DTB sits after it",
  "DarwinBoot refuses a kernel window larger than 256 MiB on this board (2 GiB, 1 GiB, 512 MiB all returned 'out of resources')",
]

