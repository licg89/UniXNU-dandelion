schema_version = 2

#
# dandelion: Xiaomi Redmi 9A (MT6762G / MT6765, 8x Cortex-A53, Mali-G72 MP1).
#
# Filled from unixnu.com/zh/porting/steps and the measurements the previous attempt recorded
# (dandelion-xnu docs/RESTART-UNIXNU.md).  Values marked TODO still need a device measurement
# or a decision; nothing here is guessed silently.
#
# The previous attempt built its own MACHINE=dandelion, which meant writing the GIC, the timer
# and the pmap from scratch - and then fighting them for days.  This board takes ArmCpu (ARM64
# CPU, GIC and timer) and ArmDTPlatform (device-tree platform expert) as components instead,
# which is the whole reason for rebuilding on this framework.
#

[board]
example = false
name = "dandelion"
soc = "MT6765"
soc_source = "mt6765"
os_profile = "ipados-17.7.11-21H461"  # TODO: confirm against the IPSW the user supplies
description = "Xiaomi Redmi 9A (dandelion), MT6762G/MT6765"
kit = "dandelion"

[components]
# ArmCpu: the ARM64 CPU, GIC and timer driver - replaces this port's hand-written
#         dandelion-gic-mode.patch and zz-dandelion-cntp-timer.patch.
# ArmDTPlatform: the device-tree platform expert - replaces the generic-platform-expert
#         fallback this port had to patch into IOKit.
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot", "RamBlock",
           # The authenticated-block kit: iPadOS wants the root volume authenticated, and this
           # is what serves the eMMC windows through owner-signed policies (the
           # NATIVE_VERIFIED_BLOCK build of NativeMsdc).
           "VerifiedRoot",
           #
           # The verified-block query helper.  The owner-root acceptance check asks
           # native_verified_block_root_authorized(dev_t) whether the mounted root is a
           # window whose owner policy authenticated it; the virtio provider implements
           # that query by calling the weak native_ufs_block_authenticates, which the eMMC
           # driver defines.  It never probes here: no virtio-mmio node exists on this SoC.
           #
                                                                             "VirtioMmioBlock"]

[kernel]
defconfig = "dandelion_defconfig"

# The packaging script selects the defconfig of each OS profile from [package.defconfig].
config_fragments = ["arch:configs/common.config", "soc:configs/mt6765.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]

"archives" = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-arm-driver.py NativeAES",
  "build-native-aes-bindings.py",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
  #
  # The original ApplePMGRNub bridge that AMFI waits for.  AMFI does
  # serviceMatching("ApplePMGRNub") + waitForMatchingService and panics with
  # "No PMGR?" when nothing matches (measured on the phone; see HANDOFF 0.16).
  # The builder generates the exact 340-entry provider ABI header from the
  # reference prelinked kernel, compiles package/ShengPlatformPower.cpp against
  # it, and refuses to build if the original instructions moved.
  #
  "build-platform-power.py",
  #
  # Stage 6, first step: a block device at all.  RamBlock publishes the payload's
  # Data seed as a RAM-backed block device, and the ADT carries the RAMDisk
  # placeholder in /chosen/memory-map.  Until this exists the kernel has nothing
  # to mount and stops at "Still waiting for root device".
  #
  "build-arm-driver.py RamBlock",
  #
  # The vendored community MSDC driver (mouseos/NativeMsdc, BSD-2-Clause-Patent),
  # adapted for this board's "mediatek,mt6765-msdc" node.  Built without the window
  # block devices (NATIVE_MSDC_BLOCK_DEVICES=0) it links on its own -- no storage
  # bindings needed -- and still brings the controller up and reads the GPT, which
  # is what the first step verifies with native-msdc-persist=1.
  #
  #
  # The verifier the windows are served through: iPadOS refuses an unauthenticated
  # root ("rootvp not authenticated after mounting"), so the driver signs and checks
  # every 4096-byte block against our own owner key.
  #
  "build-verified-root.py --key /root/work/vr/os.envelope/trusted-key.bin",
  "build-native-msdc.py --block-devices 1 --verified-root --ufs-store-abi",
  #
  # IOStorageFamily's addresses are derived from our own kernel's dispatch table
  # (docs/devices/sirius: 176 of the 190 slots are kernel exports, one __DATA_CONST
  # table matches them all; the constructor forwards to IOService's and slot 7 is the
  # metaclass getter).  The step archives the driver object with those bindings.
  #
  # The verified-block query helper the owner-root audit calls.  The builder only accepts
  # the concrete transport name (NativeVirtioBlock) with --verified-root, and it writes to
  # build/virtio-mmio-block-verified.  It never probes here: no virtio-mmio node exists.
  "build-arm-driver.py NativeVirtioBlock --verified-root",
  "derive-storage-symbols.py --object build/native-msdc/NativeMsdc.o",
  #
  # With NATIVE_RAM_BLOCK and NATIVE_VIRTIO_BLOCK both on, the kernel link compares the two
  # transports' bindings records (build-xnu-4k-baseline.sh reads bindings.json beside each
  # archive) to prove they import the same original IOBlockStorageDevice symbols.  The macOS
  # builder writes that record with xcrun; this host derives the same map from our own kernel's
  # dispatch table and copies it into the expected schema, hashing each object in place.
  #
  "write-transport-bindings.py",
  #
  # The storage bindings (bind-by-vtable.py) are held back with the window block
  # devices: they resolve the 168 vtable-slot methods, but the base constructor,
  # base destructor and gMetaClass are in no symbol table this tree has (the
  # prelinked kernel's kext symbols are stripped, and the IPSW kernelcache carries
  # only kernel exports), so the link still fails on those four.
  #
  # The eMMC host (package/DandelionEmmc.cpp, build-dandelion-emmc.py) compiles and
  # archives cleanly, but it cannot be linked yet: it subclasses
  # IOBlockStorageDevice, and IOStorageFamily is a prelinked kext whose symbols do
  # not exist at kernel link time (ld reports the whole vtable undefined).  Wiring
  # it in needs a link-stub archive; until then the documented path is
  # CONFIG_XNU_SOURCE_MOCKFS, which the defconfig header calls "a root to boot
  # from before the eMMC driver exists".
  #
  # "build-dandelion-emmc.py",
]

[device_tree]
source = "device:dts/dandelion.dts"
include_dirs = ["soc:dts"]

[firmware]
# The MediaTek UEFI platform this board already boots: Mu-Silicium's MT6765 packages, carried in
# the previous repository under Silicon/MediaTek/MT6765Pkg and Platforms/Xiaomi/dandelionPkg.
# Those move here as the firmware input; the dsc/fd paths follow their layout.
config = "dandelion"
dsc = "Platforms/Xiaomi/dandelionPkg/dandelion.dsc"
fd = "Build/dandelionPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/MediaTek",
  "{uefi}/Silicon/Silicium",
]

[bootimg]
dtb = "kits/dandelion/dandelion.dtb"   # package/ maps to kits/<kit> in the build tree

[firmware.defines]
DEVICE_MODEL = "dandelion"

[payload]
volume = "DANDELION"
size_mib = 60   # the boot partition is 64 MiB; the kernel plus the verifier and the virtio helper need 53 MiB of files
loader = "firmware"
title = "UniXNU"
#
# The OS volume's Apple trust cache, taken from the IPSW (Firmware/044-76040-038.dmg.trustcache).
# Without it the payload carries only our own owner_trust_cache, whose entries are the mockfs
# fixtures, so AMFI refuses every Apple-signed image on the real root and kills launchd with
# OS_REASON_EXEC / EXEC_EXIT_REASON_SECURITY_POLICY (namespace 9, code 0x8).  The payload step
# accepts this file only if its SHA-256 is the one recorded here.
#
trust_cache_sha256 = "4563bdbf6ed8f72237d45dbba3ccde432634338f95c10d79d5d4631678a97c7c"
kernel_args = ["-v", "serial=3", "sheng-pmgr=2", "amfi_get_out_of_my_way=1", "sheng-no-lc=1", "sheng-skip-cs=1",
               "native-msdc-persist=1", "native-msdc-root=1", "native-msdc-area=20480", "native-msdc-mode=1", "launchd_unsecure_cache=1", "wdt=-1", "ignition_level=1", "-no_slto_panic", "sheng-aks=1", "native-msdc-clock=1", "native-msdc-clk=4"]
#
# amfi_get_out_of_my_way=1 keeps AMFI's policy checks relaxed for this developer
# image.  cs_enforcement_disable=1 was tried and removed: AMFI refuses it outright
# ("can't has cs_enforcement_disable" @AppleMobileFileIntegrity.cpp:5261) and
# panics.  What actually admits init is the trust cache: the fixture is ad-hoc
# signed by ld64.lld (CodeDirectory v0x20400, SHA-256, 4 KiB pages) and its CDHash
# goes into a trust_cache_module1 that the payload carries as owner_trust_cache
# (see unixnu.local.toml and scripts/cdhash_trustcache.py).  The framework's own flow signs the fixture and ships a trust-cache bundle
# (build-native-user-fixture.py calls codesign and writes trustcache.bundle, which
# the payload takes as owner_trust_cache), but codesign does not exist on this
# Linux host, so the boot argument is the way to get PID 1 past AMFI here.
#
#
# native-msdc-area=<MiB>: the iOS data area lives in the LAST N MiB of userdata, so the
# Android filesystem in front of it keeps working between iOS tests.  Without it the
# manifest has to sit at the partition start, where the Android F2FS superblock lives, and
# every test needed a userdata flash plus an Android re-setup.  The area is base-relative,
# so the same image works: manifest at area+0, windows at area+0x100000 / area+0x16a600000,
# policy region at area+align(imageBytes).
#
# rd=md0 makes the RAM disk the root device (the reference ports use it the same
# way: j716f with an APFS RAMDisk, rmx1971 with rd=ufsroot0).  The seed is HFS+,
# so apfs_vfsop_mountroot refuses it with 79 -- and then mockfs, which
# vfs_conf.c registers as the last mountroot filesystem, is what mounts.  That is
# the combination the gta4l record calls a "RAM-backed mockfs root": the RAM disk
# is the device, mockfs is the filesystem.  Both halves are needed: without
# rd=md0 the kernel waits in IOKitBSDInit for an IOMedia and never reaches
# vfs_mountroot at all (measured 2026-11-04 09:11 with a cleared log block).
#
# sheng-pmgr=2 is what makes the bridge publish the original ApplePMGRNub
# (package/ShengPlatformPower.cpp: sheng_pmgr_run() returns immediately unless the
# boot argument is set, and mode 2 is "publish the nub").  AMFI's
# ConfigurationSettings looks that nub up with waitForMatchingService and panics
# "No PMGR?" without it.
#
# Stage 5 diagnostics, one question per run (unixnu.com/guide/debugging).
#
# Measured tonight:
#   reset right after the MMU is on (stage 3)   -> device reboots: MMU on.
#   reset after serial_init (wrong call site)   -> inconclusive, see below.
#   reset after PE_consistent_debug_inherit, i.e. at the instruction *before*
#   `bl _serial_init` (0xfffffff0079da204)     -> device stops: the kernel dies
#                                                  between the MMU being enabled
#                                                  and arm_vm_init returning.
#
# So it is inside arm_vm_init, not the console: the eMMC console compiled out
# made no difference.  What is left is the page-table/physmap work, and the
# documented tool for "kernel stopped early" is the panic screen - it draws the
# panic format string into the framebuffer, which now exists
# (DARWINBOOT: video base=0x7ec50000 row=2944).  The panic screen and the reset
# probe cannot be in the same kernel (the stage-3 code pushes the renderer out of
# the padding), so this run is the panic screen alone.
#
panic_screen = true

[package]
unixnu = "../UniXNU"

[package.defconfig]
"ios-16.5-20F66" = "dandelion_defconfig"

[payload.adt]
owned_memory_size = "0x10000000"   # 512 MiB; DarwinBoot refused the 2 GiB default
# TODO: the board's identity seed, as the framework requires.
chip_id = "6765"   # hex; the board identity this port uses
unique_chip_id = "required"
#
# The OS volume of the userdata image, read from the image itself with fsapfsinfo:
#   Identifier : 04769d26-2ca0-4825-b443-e2e5f88300f2
#   Name       : DawnUpdate21H461.J120J121J207J208OS
# XNU roots the volume whose IOMedia UUID matches this, so the OS window the eMMC
# driver publishes becomes the root instead of a RAM disk.
#
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
packed_data_ramdisk = true   # the CI seed is DBRDISK1 packed

# The userdata partition of this phone's eMMC, by the evidence in HANDOFF 0.28:
# NativeMsdc read the GPT and reported "userdata sectors 13385728..122021854"
# (512-byte sectors, so lba_bytes = 512 rather than the 4096 the UFS boards use).
# The framework sizes and manifests the OS/SystemOS windows through this.
[userdata]
first_lba = 13385728
last_lba = 122021854
lba_bytes = 512
