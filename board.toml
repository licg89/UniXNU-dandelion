schema_version = 2

#
# dandelion: Xiaomi Redmi 9A (MT6762G / MT6765, 8x Cortex-A53, Mali-G72 MP1).
#
# Filled from unixnu.com/zh/porting/steps and the measurements the previous attempt recorded
# (dandelion-xnu docs/RESTART-UNIXNU.md).  Values marked TODO still need a device measurement
# or a decision; nothing here is guessed silently.
#
# The previous attempt built its own MACHINE=dandelion, which meant writing the GIC, the timer
# and the pmap from scratch - and then fighting them for days.  This board takes ArmCpu (ARM64
# CPU, GIC and timer) and ArmDTPlatform (device-tree platform expert) as components instead,
# which is the whole reason for rebuilding on this framework.
#

[board]
example = false
name = "dandelion"
soc = "MT6765"
soc_source = "mt6765"
os_profile = "ipados-17.7.11-21H461"  # TODO: confirm against the IPSW the user supplies
description = "Xiaomi Redmi 9A (dandelion), MT6762G/MT6765"
kit = "dandelion"

[components]
# ArmCpu: the ARM64 CPU, GIC and timer driver - replaces this port's hand-written
#         dandelion-gic-mode.patch and zz-dandelion-cntp-timer.patch.
# ArmDTPlatform: the device-tree platform expert - replaces the generic-platform-expert
#         fallback this port had to patch into IOKit.
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]

[kernel]
defconfig = "dandelion_defconfig"

# The packaging script selects the defconfig of each OS profile from [package.defconfig].
config_fragments = ["arch:configs/common.config", "soc:configs/mt6765.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]

"archives" = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-arm-driver.py NativeAES",
  "build-native-aes-bindings.py",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
  #
  # The original ApplePMGRNub bridge that AMFI waits for.  AMFI does
  # serviceMatching("ApplePMGRNub") + waitForMatchingService and panics with
  # "No PMGR?" when nothing matches (measured on the phone; see HANDOFF 0.16).
  # The builder generates the exact 340-entry provider ABI header from the
  # reference prelinked kernel, compiles package/ShengPlatformPower.cpp against
  # it, and refuses to build if the original instructions moved.
  #
  "build-platform-power.py",
]

[device_tree]
source = "device:dts/dandelion.dts"
include_dirs = ["soc:dts"]

[firmware]
# The MediaTek UEFI platform this board already boots: Mu-Silicium's MT6765 packages, carried in
# the previous repository under Silicon/MediaTek/MT6765Pkg and Platforms/Xiaomi/dandelionPkg.
# Those move here as the firmware input; the dsc/fd paths follow their layout.
config = "dandelion"
dsc = "Platforms/Xiaomi/dandelionPkg/dandelion.dsc"
fd = "Build/dandelionPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/MediaTek",
  "{uefi}/Silicon/Silicium",
]

[bootimg]
dtb = "kits/dandelion/dandelion.dtb"   # package/ maps to kits/<kit> in the build tree

[firmware.defines]
DEVICE_MODEL = "dandelion"

[payload]
volume = "DANDELION"
size_mib = 56   # the files take 48 MiB and must fit strictly inside; 56 + 3 MiB FD still fits 64 MiB
loader = "firmware"
title = "UniXNU"
kernel_args = ["-v", "serial=3", "sheng-pmgr=2"]
#
# sheng-pmgr=2 is what makes the bridge publish the original ApplePMGRNub
# (package/ShengPlatformPower.cpp: sheng_pmgr_run() returns immediately unless the
# boot argument is set, and mode 2 is "publish the nub").  AMFI's
# ConfigurationSettings looks that nub up with waitForMatchingService and panics
# "No PMGR?" without it.
#
# Stage 5 diagnostics, one question per run (unixnu.com/guide/debugging).
#
# Measured tonight:
#   reset right after the MMU is on (stage 3)   -> device reboots: MMU on.
#   reset after serial_init (wrong call site)   -> inconclusive, see below.
#   reset after PE_consistent_debug_inherit, i.e. at the instruction *before*
#   `bl _serial_init` (0xfffffff0079da204)     -> device stops: the kernel dies
#                                                  between the MMU being enabled
#                                                  and arm_vm_init returning.
#
# So it is inside arm_vm_init, not the console: the eMMC console compiled out
# made no difference.  What is left is the page-table/physmap work, and the
# documented tool for "kernel stopped early" is the panic screen - it draws the
# panic format string into the framebuffer, which now exists
# (DARWINBOOT: video base=0x7ec50000 row=2944).  The panic screen and the reset
# probe cannot be in the same kernel (the stage-3 code pushes the renderer out of
# the padding), so this run is the panic screen alone.
#
panic_screen = true

[package]
unixnu = "../UniXNU"

[package.defconfig]
"ios-16.5-20F66" = "dandelion_defconfig"

[payload.adt]
owned_memory_size = "0x10000000"   # 512 MiB; DarwinBoot refused the 2 GiB default
# TODO: the board's identity seed, as the framework requires.
chip_id = "6765"   # hex; the board identity this port uses
unique_chip_id = "required"
